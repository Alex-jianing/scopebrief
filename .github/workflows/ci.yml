name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --python 3.12
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest -q
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm --prefix frontend run test:e2e
      - run: docker build --tag scopebrief:ci .
      - name: Smoke-test the container
        run: |
          docker run --rm --detach --publish 127.0.0.1:8799:8000 scopebrief:ci
          curl --fail --retry 12 --retry-connrefused --retry-delay 1 http://127.0.0.1:8799/api/health
          curl --fail http://127.0.0.1:8799/ | grep -F '<title>ScopeBrief'
