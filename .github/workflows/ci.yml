name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --python 3.12
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest -q
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm --prefix frontend run test:e2e
      - run: docker build --tag scopebrief:ci .
      - name: Smoke-test the container
        run: |
          container="$(docker run --detach --env SCOPEBRIEF_DEMO=0 --publish 127.0.0.1:8799:8000 scopebrief:ci)"
          trap 'docker rm -f "$container" >/dev/null' EXIT
          if ! curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 1 --max-time 3 http://127.0.0.1:8799/api/health; then
            docker logs "$container"
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:8799/ | grep -F '<title>ScopeBrief'
          curl --fail --silent --show-error http://127.0.0.1:8799/api/session | grep -F '"mode":"team"'
          docker exec "$container" /app/.venv/bin/python -m scopebrief.admin bootstrap >/dev/null
